<script>
/* المساعد الذكي: بعد نشر الدالة على Supabase حط الرابط والمفتاح العام (anon) هنا */
const AI_URL = "https://meavuwntikizkfjhtnbd.supabase.co/functions/v1/quick-service";

const DAYS = ["الأحد", "الإثنين", "الثلاثاء", "الأربع", "الخميس", "الجمعة", "السبت"];

const HINTS = { "تراكم المحاضرات": "صفّي محاضرة متأخرة الأول", "ضيق الوقت": "ركّز على الأكتر تكرارًا في الامتحان", "صعوبة فهم المواد": "اشرحها بصوتك كأنك بتعلّم زميلك", "التأجيل وعدم الالتزام": "ابدأ بـ10 دقايق بس" };

const iso = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const dnum = s => { const [y, m, d] = s.split("-").map(Number); return Date.UTC(y, m - 1, d) / 864e5; };

/* بناء عناصر الصفحة بأمان (textContent فقط) */
function h(tag, p = {}, ...kids) {
  const n = document.createElement(tag); let val;

    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (k === "value") val = v;
    else if (v === true) n.setAttribute(k, "");

  if (val !== undefined) n.value = val;

}

/* طبقة التخزين: دلوقتي المتصفح، وبعدين تتبدّل بـ Supabase من غير ما نغيّر باقي الكود */
const store = {

/* ---------- الخطة الذكية ---------- */
function nextExam(sid, t) {
  const d = S.exams.filter(e => e.sid === sid && dnum(e.date) >= t).map(e => dnum(e.date) - t);
  return d.length ? Math.min(...d) : null;
}
function planFor(date) {
  const total = S.profile.hours * 60, t = dnum(iso(date));
  let list = S.subjects.map(s => {
    const left = nextExam(s.id, t), undone = s.lectures.filter(l => !l.done).length;
    const urgency = left === null ? 0.6 : Math.min(3, 14 / (left + 1));
    return { id: s.id, name: s.name, c: s.c, left, w: s.diff * (1 + urgency) * (1 + Math.min(undone, 10) * 0.05) };
  }).sort((a, b) => b.w - a.w);
  if (!list.length) return [];
  for (let i = 0; i < 4; i++) {
    const sum = list.reduce((a, x) => a + x.w, 0);

    if (next.length === list.length) break;
    list = next.length ? next : [list[0]];
    if (!next.length) break;
  }
  const sum = list.reduce((a, x) => a + x.w, 0);
  return list.map(x => ({ ...x, min: Math.max(5, Math.round(total * x.w / sum / 5) * 5) }));
}
function stats() {
  const dn = Object.entries(S.done), mins = dn.reduce((a, [, v]) => a + v, 0);
  const dates = new Set(dn.map(([k]) => k.split("|")[0]));
  let streak = 0; const d = new Date();
  if (!dates.has(iso(d))) d.setDate(d.getDate() - 1);
  while (dates.has(iso(d))) { streak++; d.setDate(d.getDate() - 1); }
  const lec = S.subjects.reduce((a, s) => a + s.lectures.filter(l => l.done).length, 0);
  const xp = Math.round(mins / 3) + lec * 15;
  return { mins, streak, lec, xp, lvl: Math.floor(xp / 100) + 1, tasks: dn.length };
}
const BADGES = [["🌱", "أول مهمة", s => s.tasks >= 1], ["💪", "10 مهام", s => s.tasks >= 10], ["🔥", "3 أيام متتالية", s => s.streak >= 3], ["📖", "5 محاضرات", s => s.lec >= 5], ["⏱️", "ساعة مذاكرة", s => s.mins >= 60], ["🏆", "مستوى 3", s => s.lvl >= 3]];
const subj = id => S.subjects.find(s => s.id === id);

const inp = (name, v, type = "text", extra = {}) => h("input", { name, type, value: v ?? "", required: true, ...extra });

function profileForm(onSave, btn) {
  const p = S.profile || {};

  } },
    h("div", { class: "g2" }, fld("الاسم", inp("name", p.name)), fld("اسم الجامعة", inp("uni", p.uni)),
      fld("السنة الدراسية", year), fld("ساعات المذاكرة المتاحة يوميًا", inp("hours", p.hours, "number", { min: 0.5, max: 16, step: 0.5 }))),
    h("fieldset", {}, h("legend", {}, "إيه أكبر مشكلة بتواجهك في المذاكرة؟"),
      Object.keys(HINTS).map(k => h("label", { class: "opt" }, h("input", { type: "radio", name: "problem", value: k, required: true, checked: p.problem === k }), k))),
    h("button", { type: "submit" }, btn));
  return f;
}

/* ---------- المؤقت (بيكمّل حتى لو غيّرت الصفحة) ---------- */
const DUR = [[15, "🌿", "شتلة"], [25, "🌳", "شجرة"], [45, "🌲", "صنوبرة"], [60, "🌴", "نخلة"], [90, "🌸", "شجرة مزهرة"]];
const tier = m => DUR.find(d => d[0] === m) || DUR[1];
const tm = x => (typeof x === "number" ? { t: x, m: 25 } : x);
const workSecs = () => (S.tmin || 25) * 60;
const breakSecs = () => { const m = S.tmin || 25; return (m <= 25 ? 5 : m <= 60 ? 10 : 15) * 60; };
let tLeft = (S.tmin || 25) * 60, tMode = "work", tInt = null;
let audioCtx = null;
function timerTick() {
  try {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (!AudioContext) return;
    audioCtx = audioCtx || new AudioContext();
    if (audioCtx.state === "suspended") audioCtx.resume();
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    const now = audioCtx.currentTime;

(() => { const m = location.hash.match(/^#join=([A-Za-z0-9]{4,12})$/); if (m) { S.pendingJoin = m[1].toUpperCase(); store.save(S); history.replaceState(null, "", location.pathname + location.search); } })();
const PRIMARY = ["home", "forest", "ai", "subjects"];

  nav.replaceChildren(h("div", { class: "bside" }, h("span", { class: "logo" }, "U"), "UniMate AI"), ...TABS.map(([k, l]) => h("button", { class: PRIMARY.includes(k) ? "" : "sec", "aria-current": k === tab ? "page" : null, onclick: () => goTab(k) }, ico(k), l)),
    h("button", { class: "more" + (PRIMARY.includes(tab) ? "" : " cur"), "aria-label": "المزيد", "aria-haspopup": "true", "aria-expanded": "false", onclick: () => { moreOpen = !moreOpen; paintMore(); } }, ico("more"), "المزيد"));
  paintMore();

  tPaint();
}
