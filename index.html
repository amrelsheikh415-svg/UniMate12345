button{font:inherit;font-weight:700;background:var(--brand);color:#fff;border:0;border-radius:12px;padding:10px 20px;cursor:pointer;transition:filter .15s,transform .15s}
button:hover{filter:brightness(1.1)}
button:active{transform:scale(.98)}
button:disabled{opacity:.5;cursor:default}
button.ghost{background:transparent;color:var(--brand);border:1.5px solid var(--line)}
button.ghost:hover{background:var(--soft);filter:none}
button.sm{padding:5px 14px;font-size:.88rem}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
label.f{display:block;font-weight:600;margin-bottom:10px;font-size:.94rem}
input[type=text],input[type=number],input[type=date],input[type=time],select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;margin-top:4px}
input:focus,select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--soft)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.inl{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}

.inl>button{flex:0 0 auto}
.opt{display:flex;gap:10px;align-items:center;border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;margin-bottom:8px;cursor:pointer}
.opt:has(input:checked){border-color:var(--brand);background:var(--soft)}
.opt input{accent-color:var(--brand);width:18px;height:18px}
fieldset{border:0;margin-bottom:10px}
legend{font-weight:600;margin-bottom:6px}
.bar{height:10px;border-radius:99px;background:var(--soft);overflow:hidden;margin:6px 0 12px}
.bar i{display:block;height:100%;background:var(--mint);border-radius:99px;transition:width .3s}
.row{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row input[type=checkbox]{width:20px;height:20px;accent-color:var(--mint)}
.row .t{flex:1}
.row .s{display:block;color:var(--muted);font-size:.84rem}
.row.done .n{text-decoration:line-through;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.chip{display:inline-block;border-radius:99px;padding:1px 12px;font-size:.84rem;font-weight:700;margin:2px 0 2px 6px;background:var(--soft)}
.chip.hot{background:var(--sun);color:var(--on)}
.timer{text-align:center}
.time{font-size:3.2rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.timer .inl{justify-content:center}
.timer .inl>*{flex:0 0 auto}
.chat{display:grid;gap:8px;margin:12px 0;max-height:52vh;overflow-y:auto}
.msg{padding:10px 14px;border-radius:16px;white-space:pre-wrap;max-width:92%}
.msg.u{background:var(--brand);color:#fff;justify-self:start}
.msg.a{background:var(--soft);justify-self:end}
.wd{padding:10px 0;border-top:1px solid var(--line)}
.wd:first-of-type{border-top:0}
.wd.today b{color:var(--brand)}
.cls{background:var(--sky);color:var(--on)}
.badges{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.badge{text-align:center;border-radius:16px;padding:12px 6px;background:var(--soft);font-weight:700;font-size:.88rem}
.badge i{display:block;font-style:normal;font-size:1.8rem}
.badge.off{color:var(--muted);filter:grayscale(1);opacity:.6}
.bars{display:flex;gap:8px;align-items:flex-end;height:120px}
.bars div{flex:1;text-align:center;font-size:.75rem;color:var(--muted)}
.bars em{display:block;background:linear-gradient(var(--brand2),var(--brand));border-radius:8px 8px 0 0;min-height:4px}
.note{background:var(--soft);color:var(--ink);border-radius:14px;padding:12px 16px;margin-bottom:12px}
.empty{text-align:center;padding:28px 18px}
.feat{list-style:none;margin:0 0 16px}
.feat li{padding:6px 0 6px 0;color:var(--muted)}
.feat li::before{content:"✓";color:var(--mint);font-weight:800;margin-inline-end:10px}
.nav{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:12px;right:12px;display:flex;justify-content:space-around;gap:2px;background:color-mix(in srgb,var(--surface) 88%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:24px;padding:6px;box-shadow:0 14px 34px -12px rgba(14,20,48,.35);z-index:5}
.nav .sec{display:none}
.nav button{background:none;box-shadow:none;color:var(--muted);padding:6px 2px;font-size:.72rem;line-height:1.3;flex:1;border-radius:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:1px}
.nav button .ic{display:block;height:22px}
.nav button[aria-current=page],.nav button.cur{color:var(--brand);background:var(--soft)}
.nav .more .ic svg{stroke-width:3.8}
.nav .more[aria-expanded=true]{color:var(--brand);background:var(--soft)}
.moreback{position:fixed;inset:0;z-index:6;background:rgba(14,20,48,.35)}
.moremenu{position:fixed;z-index:7;left:12px;bottom:calc(86px + env(safe-area-inset-bottom,0px));width:min(240px,calc(100vw - 24px));background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:8px;box-shadow:0 20px 44px -14px rgba(14,20,48,.45);transform-origin:bottom left;animation:pop .16s ease-out}
.moremenu button{display:flex;align-items:center;gap:12px;width:100%;background:none;box-shadow:none;color:var(--ink);padding:11px 12px;border-radius:14px;font-size:.98rem;text-align:start}
.moremenu button:hover{background:var(--soft);filter:none}
.moremenu button[aria-current=page]{color:var(--brand);background:var(--soft)}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:none}}
.bside{display:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:12px;font-weight:600;z-index:20;box-shadow:var(--shadow)}
dialog{border:0;border-radius:20px;padding:22px;max-width:340px;width:90%;margin:auto;background:var(--surface);color:var(--ink);box-shadow:0 20px 50px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(14,20,48,.55)}
dialog .inl{margin-top:16px;justify-content:flex-end}
dialog .inl>*{flex:0 0 auto}

.nav .sec{display:flex}

  const total = S.profile.hours * 60, t = dnum(iso(date));
  let list = S.subjects.map(s => {
    const left = nextExam(s.id, t), undone = s.lectures.filter(l => !l.done).length;
    const urgency = left === null ? 0.6 : Math.min(3, 14 / (left + 1));
    return { id: s.id, name: s.name, c: s.c, left, w: s.diff * (1 + urgency) * (1 + Math.min(undone, 10) * 0.05) };
  }).sort((a, b) => b.w - a.w);

    const sum = list.reduce((a, x) => a + x.w, 0);

    if (next.length === list.length) break;
    list = next.length ? next : [list[0]];
    if (!next.length) break;

  const sum = list.reduce((a, x) => a + x.w, 0);
  return list.map(x => ({ ...x, min: Math.max(5, Math.round(total * x.w / sum / 5) * 5) }));
}

function timerTick() {
  try {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (!AudioContext) return;
    audioCtx = audioCtx || new AudioContext();
    if (audioCtx.state === "suspended") audioCtx.resume();
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    const now = audioCtx.currentTime;
    osc.type = "sine"; osc.frequency.value = 900;

    osc.start(now); osc.stop(now + 0.05);
  } catch (e) {}
}
function timerChime() {
